version: 2

models:
  - name: stg_taxi_zones
    description: "Číselník taxi zón"
    columns:
      - name: location_id
        tests:
          - unique
          - not_null

  - name: stg_nyc_yellow_taxi
    description: "Záznamy o jízdách žlutých taxíků v New Yorku (Yellow Taxi)"
    columns:
      - name: vendor_id
        tests:
          - unique
          - not_null